name: release-desktop

# Builds the Windows NSIS installer + portable exe on a Windows runner and
# attaches them (plus SHA256SUMS.txt) to a GitHub Release.
# Triggered by pushing a version tag:  git tag v0.1.0 && git push --tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint + typecheck + tests
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:integration

      - name: Build desktop app + Windows artifacts
        working-directory: apps/desktop
        run: npm run package:win

      - name: Generate SHA256SUMS.txt
        working-directory: apps/desktop/release
        shell: pwsh
        run: |
          Get-ChildItem -File *.exe | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: List artifacts
        working-directory: apps/desktop/release
        run: dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: handshack-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.0.9
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS.txt
          generate_release_notes: true
          # NOTE: executables are unsigned until a code-signing certificate is
          # configured — see docs/RELEASE_PROCESS.md.
